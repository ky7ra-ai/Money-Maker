name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unduh font terbuka
        run: bash scripts/fetch-fonts.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FotoTeks.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FotoTeks-apk
          path: FotoTeks.apk

      - name: Publish ke Releases (tag "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest FotoTeks.apk \
            --target "${{ github.sha }}" \
            --latest \
            --title "Edit Teks Foto - build #${{ github.run_number }}" \
            --notes "APK terbaru dari commit ${{ github.sha }}. Download file FotoTeks.apk lalu install di Android."

      - name: Simpan log build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/buildlog
          cp build.log /tmp/buildlog/build.log || echo "tidak ada log" > /tmp/buildlog/build.log
          bash .github/scripts/push-logs.sh ci-logs /tmp/buildlog

  visual-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unduh font terbuka
        run: bash scripts/fetch-fonts.sh 2>&1 | tee fonts.log

      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Uji visual di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/run-visual-test.sh

      - name: Simpan hasil uji visual
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/visual
          cp -r visual-out/. /tmp/visual/ 2>/dev/null || true
          cp visual.log /tmp/visual/ 2>/dev/null || true
          cp fonts.log /tmp/visual/ 2>/dev/null || true
          [ -n "$(ls -A /tmp/visual)" ] || echo "tidak ada keluaran" > /tmp/visual/EMPTY.txt
          bash .github/scripts/push-logs.sh ci-visual /tmp/visual
